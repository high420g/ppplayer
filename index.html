<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundCloud Web Player</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: linear-gradient(135deg, #0f0c1b, #201c3a); color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .player-container { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 30px; width: 100%; max-width: 460px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); text-align: center; }
        
        .search-box { display: flex; background: rgba(255,255,255,0.1); border-radius: 50px; padding: 5px 15px; margin-bottom: 20px; border: 1px solid transparent; transition: 0.3s; align-items: center; }
        .search-box:focus-within { border-color: #ff5500; background: rgba(255,255,255,0.15); }
        .search-box input { background: none; border: none; color: white; padding: 10px; width: 100%; font-size: 14px; outline: none; }
        .search-box button { background: none; border: none; color: #ff5500; cursor: pointer; font-size: 18px; padding: 0 10px; }

        .widget-wrapper { width: 100%; height: 380px; border-radius: 16px; overflow: hidden; background: #222; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        iframe { border: none; width: 100%; height: 100%; }
        
        .hint-text { font-size: 12px; color: #b3b3b3; margin-top: 15px; line-height: 1.4; }
        .brand-color { color: #ff5500; font-weight: 600; }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Поиск треков / исполнителей -->
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Введите название трека или артиста...">
            <button id="search-btn"><i class="fas fa-search"></i></button>
        </div>

        <!-- Контейнер для плеера SoundCloud -->
        <div class="widget-wrapper">
            <iframe id="sc-player" src="https://soundcloud.com"></iframe>
        </div>

        <div class="hint-text">
            Интеграция с <span class="brand-color">SoundCloud API</span>. Вы можете искать любые треки, плейлисты или авторов прямо через верхнюю панель.
        </div>
    </div>

    <script>
        const searchBtn = document.getElementById('search-btn');
        const searchInput = document.getElementById('search-input');
        const scPlayer = document.getElementById('sc-player');

        function doSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            // Формируем безопасную поисковую ссылку для виджета SoundCloud
            const scSearchUrl = `https://soundcloud.com{encodeURIComponent(query)}`;
            
            // Обновляем фрейм, перенаправляя его на результаты поиска SoundCloud в плеере
            scPlayer.src = `https://soundcloud.com{encodeURIComponent(query)}&color=%23ff5500&auto_play=true`;
            
            // Альтернативный надежный вариант загрузки на лету через oEmbed
            scPlayer.src = `https://soundcloud.com{encodeURIComponent(query)}&color=%23ff5500&auto_play=true`;
        }

        searchBtn.addEventListener('click', doSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') doSearch();
        });
    </script>
</body>
</html>
