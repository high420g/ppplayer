<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Music Hub</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: linear-gradient(135deg, #0b0813, #161329); color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        
        .player-container { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 24px; 
            padding: 25px; 
            width: 100%; 
            max-width: 480px; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.8); 
            text-align: center; 
        }
        
        .player-header { font-size: 20px; font-weight: 700; margin-bottom: 20px; color: #ff0055; letter-spacing: 1px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        .search-box { display: flex; background: rgba(255,255,255,0.06); border-radius: 50px; padding: 5px 15px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; align-items: center; }
        .search-box:focus-within { border-color: #ff0055; background: rgba(255,255,255,0.1); box-shadow: 0 0 15px rgba(255,0,85,0.3); }
        .search-box input { background: none; border: none; color: white; padding: 12px; width: 100%; font-size: 14px; outline: none; }
        .search-box button { background: none; border: none; color: #ff0055; cursor: pointer; font-size: 18px; padding: 0 10px; transition: 0.2s; }
        .search-box button:hover { transform: scale(1.1); }

        .widget-wrapper { 
            width: 100%; 
            height: 270px; 
            border-radius: 16px; 
            overflow: hidden; 
            background: #000; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        
        iframe { border: none; width: 100%; height: 100%; }
        
        .footer-info { font-size: 12px; color: #666; margin-top: 15px; line-height: 1.4; font-weight: 500; }
        .brand { color: #ff0055; font-weight: 600; }
    </style>
</head>
<body>

    <div class="player-container">
        <div class="player-header">
            <i class="fas fa-headphones-alt"></i> PREMIUM MUSIC HUB
        </div>

        <!-- Поисковая строка -->
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Введите трек (например: OG Buda, Rocket)...">
            <button id="search-btn"><i class="fas fa-search"></i></button>
        </div>

        <!-- Сюда будет загружаться музыкальный поток -->
        <div class="widget-wrapper">
            <iframe id="music-player" src="https://youtube.com"></iframe>
        </div>

        <div class="footer-info">
            Поиск работает по всей мировой базе треков. Введите любого исполнителя и нажмите <span class="brand">Enter</span>.
        </div>
    </div>

    <script>
        const searchBtn = document.getElementById('search-btn');
        const searchInput = document.getElementById('search-input');
        const musicPlayer = document.getElementById('music-player');

        function startSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            // Магия: переключаем плеер в режим автопоиска по YouTube и сразу включаем первый найденный трек
            musicPlayer.src = `https://youtube.com{encodeURIComponent(query)}&autoplay=1`;
        }

        searchBtn.addEventListener('click', startSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') startSearch();
        });
    </script>
</body>
</html>
