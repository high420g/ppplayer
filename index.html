<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundCloud Premium Player</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: linear-gradient(135deg, #09070f, #131124); color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        
        .player-container { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 24px; 
            padding: 25px; 
            width: 100%; 
            max-width: 480px; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.7); 
            text-align: center; 
        }
        
        .player-header { font-size: 20px; font-weight: 700; margin-bottom: 20px; color: #ff5500; letter-spacing: 1px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        .widget-wrapper { 
            width: 100%; 
            height: 450px; 
            border-radius: 16px; 
            overflow: hidden; 
            background: #111; 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        iframe { border: none; width: 100%; height: 100%; }
        
        .footer-info { font-size: 11px; color: #777; margin-top: 15px; line-height: 1.4; }
        .brand { color: #ff5500; font-weight: 600; }
    </style>
</head>
<body>

    <div class="player-container">
        <div class="player-header">
            <i class="fab fa-soundcloud"></i> SOUNDCLOUD HUB
        </div>

        <!-- Официальное безопасное окно SoundCloud с полной медиатекой -->
        <div class="widget-wrapper">
            <iframe src="https://soundcloud.com"></iframe>
        </div>

        <div class="footer-info">
            Доступ ко всей базе треков <span class="brand">SoundCloud</span>. Чтобы найти своего исполнителя, просто нажми кнопку поиска или плейлиста прямо внутри верхнего правого угла окна плеера.
        </div>
    </div>

</body>
</html>
