<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Music Stream Player</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: linear-gradient(135deg, #0f0c1b, #201c3a); color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .player-container { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 30px; width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); text-align: center; }
        
        .search-box { display: flex; background: rgba(255,255,255,0.1); border-radius: 50px; padding: 5px 15px; margin-bottom: 25px; border: 1px solid transparent; transition: 0.3s; align-items: center; }
        .search-box:focus-within { border-color: #00f0ff; background: rgba(255,255,255,0.15); }
        .search-box input { background: none; border: none; color: white; padding: 10px; width: 100%; font-size: 14px; outline: none; }
        .search-box button { background: none; border: none; color: #00f0ff; cursor: pointer; font-size: 18px; padding: 0 10px; }

        .track-art { width: 220px; height: 220px; background: linear-gradient(45deg, #00f0ff, #7000ff); margin: 0 auto 25px; border-radius: 50%; box-shadow: 0 10px 25px rgba(0,240,255,0.3); display: flex; align-items: center; justify-content: center; font-size: 60px; color: #fff; transition: transform 0.5s infinite linear; }
        .track-art.playing { animation: rotateArt 10s infinite linear; box-shadow: 0 0 35px rgba(0,240,255,0.6); }
        
        @keyframes rotateArt { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .track-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #00f0ff; }
        .track-artist { font-size: 14px; color: #b3b3b3; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; }
        
        .controls { display: flex; justify-content: center; align-items: center; gap: 25px; margin-bottom: 25px; }
        .btn { background: none; border: none; color: #b3b3b3; font-size: 24px; cursor: pointer; transition: 0.2s; }
        .btn:hover { color: white; transform: scale(1.1); }
        .btn-play { width: 65px; height: 65px; background: #00f0ff; border-radius: 50%; color: black; font-size: 26px; display: flex; align-items: center; justify-content: center; border: none; box-shadow: 0 5px 15px rgba(0,240,255,0.4); }
        .btn-play:hover { background: #55f5ff; transform: scale(1.05); }
        
        .volume-container { display: flex; align-items: center; justify-content: center; gap: 15px; color: #b3b3b3; font-size: 14px; }
        .volume-slider { -webkit-appearance: none; width: 100px; height: 5px; background: rgba(255,255,255,0.2); border-radius: 50px; outline: none; }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #00f0ff; border-radius: 50%; cursor: pointer; }
        
        .status-msg { font-size: 13px; color: #00f0ff; margin-top: 20px; height: 15px; font-weight: 600; }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Поиск потоков -->
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Поиск (rap, rock, pop, chill)...">
            <button id="search-btn"><i class="fas fa-search"></i></button>
        </div>

        <!-- Визуализация диска -->
        <div class="track-art" id="track-art"><i class="fas fa-compact-disc"></i></div>

        <!-- Информация о текущем потоке -->
        <div class="track-title" id="track-title">Загрузка потоков...</div>
        <div class="track-artist" id="track-artist">Жанр</div>

        <!-- Кнопки -->
        <div class="controls">
            <button class="btn" id="prev-btn"><i class="fas fa-backward"></i></button>
            <button class="btn btn-play" id="play-btn"><i class="fas fa-play"></i></button>
            <button class="btn" id="next-btn"><i class="fas fa-forward"></i></button>
        </div>

        <!-- Громкость -->
        <div class="volume-container">
            <i class="fas fa-volume-down"></i>
            <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.05" value="0.5">
            <i class="fas fa-volume-up"></i>
        </div>

        <div class="status-msg" id="status-msg">Нажмите PLAY для воспроизведения</div>
    </div>

    <script>
        const playBtn = document.getElementById('play-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const searchBtn = document.getElementById('search-btn');
        const searchInput = document.getElementById('search-input');
        const trackArt = document.getElementById('track-art');
        const trackTitle = document.getElementById('track-title');
        const trackArtist = document.getElementById('track-artist');
        const volumeSlider = document.getElementById('volume-slider');
        const statusMsg = document.getElementById('status-msg');

        const audio = new Audio();
        let currentTrackIndex = 0;
        let isPlaying = false;

        // База стабильных музыкальных станций, которые никогда не заблокируют подключение
        const stationLibrary = [
            { name: "Hot Hip-Hop & Rap", artist: "RAP / URBAN", url: "https://syntheticfm.com" },
            { name: "Synthwave Neo Drive", artist: "SYNTH / PHONK", url: "https://nightride.fm" },
            { name: "Chillout Lounge Beats", artist: "CHILL / LO-FI", url: "https://ndr.de" },
            { name: "Ultimate Rock Hits", artist: "ROCK / METAL", url: "https://rockantenne.as صد.fastly.net/rockantenne/stream/mp3" },
            { name: "Top 40 Pop Hits", artist: "POP / DANCE", url: "https://wdr.de" }
        ];

        // Запасные рабочие зеркала на случай сбоев магистралей
        stationLibrary[3].url = "https://rockantenne.de"; 

        let playlist = [...stationLibrary];

        function loadTrack(index) {
            if (playlist.length === 0) return;
            const track = playlist[index];
            trackTitle.textContent = track.name;
            trackArtist.textContent = track.artist;
            audio.src = track.url;
            audio.volume = volumeSlider.value;
        }

        function playTrack() {
            statusMsg.textContent = "Подключение к потоку...";
            audio.play()
                .then(() => {
                    isPlaying = true;
                    playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                    trackArt.classList.add('playing');
                    statusMsg.textContent = "Сейчас играет ⚡";
                })
                .catch(e => {
                    statusMsg.textContent = "Ошибка запуска. Попробуйте другой трек.";
                    isPlaying = false;
                    playBtn.innerHTML = '<i class="fas fa-play"></i>';
                    trackArt.classList.remove('playing');
                });
        }

        function togglePlay() {
            if (playlist.length === 0) return;
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                trackArt.classList.remove('playing');
                statusMsg.textContent = "Пауза";
            } else {
                playTrack();
            }
        }

        function nextTrack() {
            if (playlist.length === 0) return;
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            playTrack();
        }

        function prevTrack() {
            if (playlist.length === 0) return;
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrackIndex);
            playTrack();
        }

        function searchMusic(query) {
            const cleanQuery = query.toLowerCase().trim();
            if (!cleanQuery) {
                playlist = [...stationLibrary];
                statusMsg.textContent = "Показаны все каналы";
            } else {
                playlist = stationLibrary.filter(track => 
                    track.name.toLowerCase().includes(cleanQuery) || 
                    track.artist.toLowerCase().includes(cleanQuery)
                );
                
                if (playlist.length > 0) {
                    statusMsg.textContent = `Найдено каналов: ${playlist.length}`;
                } else {
                    statusMsg.textContent = "Не найдено. Попробуйте: rap, rock, synth";
                    playlist = [...stationLibrary];
                }
            }
            currentTrackIndex = 0;
            loadTrack(currentTrackIndex);
            playTrack();
        }

        // Инициализация
        loadTrack(currentTrackIndex);

        volumeSlider.addEventListener('input', (e) => { audio.volume = e.target.value; });
        playBtn.addEventListener('click', togglePlay);
        nextBtn.addEventListener('click', nextTrack);
        prevBtn.addEventListener('click', prevTrack);
        searchBtn.addEventListener('click', () => searchMusic(searchInput.value));
searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') searchMusic(searchInput.value); });
