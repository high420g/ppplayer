<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Music Hub</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: linear-gradient(135deg, #0f0c1b, #201c3a); color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .player-container { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 30px; width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); text-align: center; }
        
        .search-box { display: flex; background: rgba(255,255,255,0.1); border-radius: 50px; padding: 5px 15px; margin-bottom: 25px; border: 1px solid transparent; transition: 0.3s; align-items: center; }
        .search-box:focus-within { border-color: #1db954; background: rgba(255,255,255,0.15); }
        .search-box input { background: none; border: none; color: white; padding: 10px; width: 100%; font-size: 14px; outline: none; }
        
        .track-art { width: 220px; height: 220px; background: linear-gradient(45deg, #1db954, #191414); margin: 0 auto 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; font-size: 50px; color: #fff; }
        .track-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
        .track-artist { font-size: 14px; color: #b3b3b3; margin-bottom: 25px; }
        
        .platform-buttons { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
        .platform-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 14px; border: none; border-radius: 50px; font-size: 15px; font-weight: 700; cursor: pointer; text-decoration: none; transition: 0.2s; color: #fff; }
        
        .btn-sc { background: #ff5500; box-shadow: 0 4px 15px rgba(255, 85, 0, 0.3); }
        .btn-sc:hover { background: #ff7733; transform: scale(1.02); }
        .btn-yt { background: #ff0000; box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3); }
        .btn-yt:hover { background: #ff3333; transform: scale(1.02); }
        
        .status-msg { font-size: 12px; color: #b3b3b3; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Поиск треков -->
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Введите трек (OG Buda, Rocket)..." value="OG Buda">
        </div>

        <div class="track-art"><i class="fas fa-compact-disc"></i></div>
        <div class="track-title" id="display-title">OG Buda</div>
        <div class="track-artist">Глобальный поиск трека</div>

        <!-- Кнопки мгновенного перенаправления в стриминги -->
        <div class="platform-buttons">
            <a href="https://soundcloud.com" target="_blank" class="platform-btn btn-sc" id="sc-link">
                <i class="fab fa-soundcloud"></i> Включить в SoundCloud
            </a>
            <a href="https://youtube.com" target="_blank" class="platform-btn btn-yt" id="yt-link">
                <i class="fab fa-youtube"></i> Включить в YouTube Music
            </a>
        </div>

        <div class="status-msg">Введите трек и выберите платформу для проигрывания</div>
    </div>

    <script>
        const searchInput = document.getElementById('search-input');
        const displayTitle = document.getElementById('display-title');
        const scLink = document.getElementById('sc-link');
        const ytLink = document.getElementById('yt-link');

        function updateLinks() {
            const query = searchInput.value.trim();
            if (!query) return;

            // Обновляем визуальное название трека в плеере
            displayTitle.textContent = query;

            // Генерируем прямые ссылки для обхода CORS блокировок
            scLink.href = `https://soundcloud.com{encodeURIComponent(query)}`;
            ytLink.href = `https://youtube.com{encodeURIComponent(query)}`;
        }

        // Обновление ссылок на лету при вводе текста
        searchInput.addEventListener('input', updateLinks);
    </script>
</body>
</html>
