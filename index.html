<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Music Player</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- Подключаем библиотеку иконок, чтобы стрелки точно отображались -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: #18181c; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .player-container { background: #222227; border-radius: 20px; padding: 30px; width: 100%; max-width: 360px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        .track-art { width: 180px; height: 180px; background: linear-gradient(45deg, #00f0ff, #7000ff); margin: 0 auto 20px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 50px; color: #fff; }
        .track-title { font-size: 20px; font-weight: 700; margin-bottom: 5px; color: #00f0ff; }
        .track-artist { font-size: 14px; color: #b3b3b3; margin-bottom: 25px; }
        .controls { display: flex; justify-content: center; align-items: center; gap: 30px; margin-bottom: 25px; }
        
        /* Стили для кнопок, чтобы они гарантированно были видны */
        .btn { background: none; border: none; color: #00f0ff; font-size: 28px; cursor: pointer; display: inline-block; width: 40px; height: 40px; }
        .btn:hover { color: #fff; }
        .btn-play { width: 60px; height: 60px; background: #00f0ff; border-radius: 50%; color: #000; font-size: 24px; }
        .btn-play:hover { background: #55f5ff; }
        
        .status-msg { font-size: 12px; color: #b3b3b3; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="player-container">
        <div class="track-art"><i class="fas fa-music"></i></div>
        <div class="track-title" id="track-title">Трек 1</div>
        <div class="track-artist" id="track-artist">Исполнитель 1</div>

        <!-- Кнопки управления теперь имеют четкие физические размеры и точно будут на экране -->
        <div class="controls">
            <button class="btn" id="prev-btn" title="Назад"><i class="fas fa-backward"></i></button>
            <button class="btn btn-play" id="play-btn" title="Play"><i class="fas fa-play"></i></button>
            <button class="btn" id="next-btn" title="Вперед"><i class="fas fa-forward"></i></button>
        </div>

        <div class="status-msg" id="status-msg">Нажмите PLAY для теста звука</div>
    </div>

    <script>
        const playBtn = document.getElementById('play-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const trackTitle = document.getElementById('track-title');
        const trackArtist = document.getElementById('track-artist');
        const statusMsg = document.getElementById('status-msg');

        const audio = new Audio();
        let currentTrackIndex = 0;
        let isPlaying = false;

        // Плейлист со стабильными аудиофайлами напрямую из репозиториев GitHub
        const playlist = [
            { name: "музыкальный трек 1", artist: "GitHub Audio 1", url: "https://githubusercontent.com" },
            { name: "музыкальный трек 2", artist: "GitHub Audio 2", url: "https://githubusercontent.com" },
            { name: "музыкальный трек 3", artist: "GitHub Audio 3", url: "https://github.com" }
        ];

        function loadTrack(index) {
            const track = playlist[index];
            trackTitle.textContent = track.name;
            trackArtist.textContent = track.artist;
            audio.src = track.url;
        }

        function playTrack() {
            statusMsg.textContent = "Загрузка аудио...";
            audio.play()
                .then(() => {
                    isPlaying = true;
                    playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                    statusMsg.textContent = "Играет!";
                })
                .catch(e => {
                    statusMsg.textContent = "Ошибка. Попробуйте нажать кнопку Вперед ->";
                });
        }

        function togglePlay() {
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                statusMsg.textContent = "Пауза";
            } else {
                playTrack();
            }
        }

        function nextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            playTrack();
        }

        function prevTrack() {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrackIndex);
            playTrack();
        }

        // Старт
        loadTrack(currentTrackIndex);

        playBtn.addEventListener('click', togglePlay);
        nextBtn.addEventListener('click', nextTrack);
        prevBtn.addEventListener('click', prevTrack);
    </script>
</body>
</html>
