<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Web Player</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: linear-gradient(135deg, #0b0914, #1a1530); color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .player-container { background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; padding: 30px; width: 100%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); text-align: center; }
        
        .search-box { display: flex; background: rgba(255,255,255,0.07); border-radius: 50px; padding: 5px 15px; margin-bottom: 25px; border: 1px solid transparent; transition: 0.3s; align-items: center; }
        .search-box:focus-within { border-color: #00f0ff; background: rgba(255,255,255,0.12); box-shadow: 0 0 15px rgba(0,240,255,0.2); }
        .search-box input { background: none; border: none; color: white; padding: 12px; width: 100%; font-size: 14px; outline: none; }
        .search-box button { background: none; border: none; color: #00f0ff; cursor: pointer; font-size: 18px; padding: 0 10px; }

        .track-art { width: 200px; height: 200px; background: linear-gradient(45deg, #00f0ff, #7000ff); margin: 0 auto 25px; border-radius: 50%; box-shadow: 0 10px 25px rgba(0,240,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 50px; color: #fff; background-size: cover; background-position: center; transition: 0.3s ease; }
        .track-art.playing { animation: rotateDisc 12s infinite linear; box-shadow: 0 0 30px rgba(0,240,255,0.4); }
        @keyframes rotateDisc { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .track-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #00f0ff; }
        .track-artist { font-size: 14px; color: #b3b3b3; margin-bottom: 25px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .progress-container { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; cursor: pointer; margin-bottom: 25px; }
        .progress-bar { height: 100%; width: 0%; background: #00f0ff; border-radius: 10px; transition: width 0.1s linear; }

        .controls { display: flex; justify-content: center; align-items: center; gap: 25px; margin-bottom: 20px; }
        .btn { background: none; border: none; color: #b3b3b3; font-size: 22px; cursor: pointer; transition: 0.2s; width: 40px; height: 40px; }
        .btn:hover { color: white; transform: scale(1.1); }
        .btn-play { width: 60px; height: 60px; background: #00f0ff; border-radius: 50%; color: black; font-size: 24px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,240,255,0.3); }
        .btn-play:hover { background: #55f5ff; transform: scale(1.05); }
        
        .status-msg { font-size: 12px; color: #00f0ff; margin-top: 15px; height: 15px; font-weight: 600; }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Поиск музыки -->
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Введите жанр или трек (на англ.)...">
            <button id="search-btn"><i class="fas fa-search"></i></button>
        </div>

        <!-- Обложка диска -->
        <div class="track-art" id="track-art"><i class="fas fa-compact-disc"></i></div>

        <!-- Описание трека -->
        <div class="track-title" id="track-title">Музыкальный Плеер</div>
        <div class="track-artist" id="track-artist">Поиск по электронной базе</div>

        <!-- Прогресс -->
        <div class="progress-container" id="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <!-- Кнопки управления -->
        <div class="controls">
            <button class="btn" id="prev-btn"><i class="fas fa-backward"></i></button>
            <button class="btn btn-play" id="play-btn"><i class="fas fa-play"></i></button>
            <button class="btn" id="next-btn"><i class="fas fa-forward"></i></button>
        </div>

        <div class="status-msg" id="status-msg">Введите, например: hiphop, bass, rock или chill</div>
    </div>

    <script>
        const playBtn = document.getElementById('play-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const searchBtn = document.getElementById('search-btn');
        const searchInput = document.getElementById('search-input');
        const trackArt = document.getElementById('track-art');
        const trackTitle = document.getElementById('track-title');
        const trackArtist = document.getElementById('track-artist');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const statusMsg = document.getElementById('status-msg');

        const audio = new Audio();
        let playlist = [];
        let currentTrackIndex = 0;
        let isPlaying = false;

        // Использование резервного стабильного шлюза, открытого для веб-сайтов
        async function searchMusic(query) {
            if (!query) return;
            statusMsg.textContent = 'Подключение к медиатеке...';
            
            try {
                // Прямой запрос к открытой базе музыки без ограничений CORS
                const response = await fetch(`https://jamendo.com{encodeURIComponent(query)}&include=musicinfo`);
                const data = await response.json();
                
                if (data.results && data.results.length > 0) {
                    playlist = data.results.filter(track => track.audio);
                    currentTrackIndex = 0;
                    
                    if (playlist.length > 0) {
                        loadTrack(currentTrackIndex);
                        playTrack();
                        statusMsg.textContent = `Найдено треков: ${playlist.length}`;
                    } else {
                        statusMsg.textContent = 'Аудиофайлы временно заняты.';
                    }
                } else {
                    statusMsg.textContent = 'Ничего не найдено. Попробуйте другой запрос.';
                }
            } catch (error) {
                statusMsg.textContent = 'Ошибка сети. Попробуйте ещё раз.';
                console.error(error);
            }
        }

        function loadTrack(index) {
            const track = playlist[index];
            trackTitle.textContent = track.name;
            trackArtist.textContent = track.artist_name;
            audio.src = track.audio;
            
            if (track.image) {
                trackArt.style.backgroundImage = `url('${track.image}')`;
                trackArt.innerHTML = '';
            } else {
                trackArt.style.backgroundImage = 'none';
                trackArt.innerHTML = '<i class="fas fa-compact-disc"></i>';
            }
        }

        function playTrack() {
            audio.play()
                .then(() => {
                    isPlaying = true;
                    playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                    trackArt.classList.add('playing');
                })
                .catch(err => {
                    statusMsg.textContent = "Нажмите PLAY для запуска трека";
                });
        }

        function togglePlay() {
            if (playlist.length === 0) {
                statusMsg.textContent = 'Сначала введите запрос в поиск!';
                return;
            }
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                trackArt.classList.remove('playing');
            } else {
                playTrack();
            }
        }

        function nextTrack() {
            if (playlist.length === 0) return;
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            playTrack();
        }

        function prevTrack() {
            if (playlist.length === 0) return;
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrackIndex);
            playTrack();
        }

        // Обновление таймлайна
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const progressPercent = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = `${progressPercent}%`;
            }
        });

        // Перемотка кликом
        progressContainer.addEventListener('click', (e) => {
            if (!audio.duration) return;
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            audio.currentTime = (clickX / width) * audio.duration;
        });

        audio.addEventListener('ended', nextTrack);
        playBtn.addEventListener('click', togglePlay);
        nextBtn.addEventListener('click', nextTrack);
        prevBtn.addEventListener('click', prevTrack);
        
        searchBtn.addEventListener('click', () => searchMusic(searchInput.value));
        searchInput.addEventListener('keypress', (e) => {if (e.key === 'Enter') searchMusic(searchInput.value);});
